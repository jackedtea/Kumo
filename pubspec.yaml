name: kumo
description: "Cross-platform Jellyfin client with a built-in player"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.4.2
  go_router: ^18.1.2
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0
  path: ^1.9.1
  path_provider: ^2.1.6
  window_manager: ^0.5.2
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  dio: ^5.11.0
  collection: ^1.19.1
  # Pinned by flutter_localizations, which depends on exactly 0.20.2.
  intl: ^0.20.2
  screen_brightness: ^2.1.11
  # SOAP, for talking to a DLNA renderer.
  xml: ^7.0.1
  flutter_localizations:
    sdk: flutter
  # Held on the 1.x line deliberately. 2.x is built against the separate
  # `material_ui` package, whose `ColorScheme` is a different type from
  # Flutter's, so `DynamicColorBuilder` no longer hands back something
  # `MaterialApp.theme` accepts.
  dynamic_color: ^1.7.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  cached_network_image: ^4.0.3
  # The server PIN's hash. Already in the tree through other packages.
  crypto: ^3.0.7
  # Wi-Fi-only downloads: whether the network the device is on is metered.
  connectivity_plus: ^7.3.2
  # Asking Windows whether this is an MSIX (core/install_source.dart).
  # Already in the tree through path_provider.
  ffi: ^2.2.0
  # Books (docs/BOOKS_PLAN.md). PDFium, on all five platforms.
  pdfrx: ^2.4.8
  # The EPUB reader: foliate-js (assets/foliate/) in a WebView. The Flutter
  # team's own plugin: Android, iOS and macOS. On Windows and Linux an EPUB
  # is handed to the system instead. Not flutter_inappwebview, whose Android
  # half (1.1.3, the last) does not build under AGP 9.
  webview_flutter: ^4.14.1
  # CBZ / CBT comics, read page by page from the archive on disk.
  archive: ^4.7.1
dependency_overrides:
  media_kit_libs_android_video:
    path: packages/media_kit_libs_android_video

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  # Build-time only, like flutter_launcher_icons: it writes the native splash
  # resources and is never linked into the app.
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4
  http: ^1.6.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Generates AppLocalizations from lib/l10n/*.arb; see l10n.yaml.
  generate: true

  assets:
    # App mark, for in-app use (about screen, empty states, window icon).
    # Launcher icons themselves are generated into the native projects by
    # `dart run flutter_launcher_icons` and are not bundled from here.
    - assets/icon/icon.png
    - assets/icon/icon_256.png
    # Surfaced through LicenseRegistry so the font's OFL notice appears in the
    # About page's licences list. See main.dart.
    - assets/fonts/OFL.txt
    # The subtitle faces' notices, registered the same way.
    - assets/fonts/subtitles/OFL-NotoSans.txt
    - assets/fonts/subtitles/OFL-BeVietnamPro.txt
    - assets/fonts/subtitles/OFL-Lora.txt
    # The EPUB reader: foliate-js (MIT, LICENSE inside, registered in
    # main.dart) and the page that bridges it to Dart. Served to the WebView
    # by features/books/reader_server.dart.
    - assets/foliate/
    - assets/foliate/vendor/

  fonts:
    # Roboto is bundled rather than fetched at runtime (as `google_fonts`
    # would): the app must look right on first launch with no network, and
    # only Android supplies Roboto as a system font.
    #
    # This is the canonical variable font from google/fonts (OFL-1.1). It is
    # declared once with no `weight:` — since Flutter's font-weight-variation
    # change, a TextStyle's FontWeight drives the `wght` axis directly, so
    # every weight the design uses comes out of this one file.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Variable.ttf
    # Subtitle faces (Player settings > Subtitles > Font), all OFL and all
    # with full Vietnamese. Copied to a folder libmpv reads by
    # `subtitle_fonts.dart`; declared here as well so the settings preview
    # draws in the face it names.
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/subtitles/NotoSans-Variable.ttf
    - family: Be Vietnam Pro
      fonts:
        - asset: assets/fonts/subtitles/BeVietnamPro-Medium.ttf
          weight: 500
    - family: Lora
      fonts:
        - asset: assets/fonts/subtitles/Lora-Variable.ttf

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
